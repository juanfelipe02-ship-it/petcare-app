<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetCare Pro - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4A90E2 0%, #357ABD 50%, #2C3E50 100%);
      padding: 1rem;
    }
    .auth-container {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #4A90E2, #357ABD);
      color: white;
      padding: 2rem;
      text-align: center;
    }
    .auth-header .logo-large {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .auth-header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .auth-body {
      padding: 2rem;
    }
    .auth-body .form-group {
      margin-bottom: 1.25rem;
    }
    .auth-body .form-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }
    .auth-body .form-group input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: var(--bg-input);
      color: var(--text-primary);
    }
    .auth-body .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(74,144,226,0.15);
      outline: none;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 1rem;
    }
    .input-wrapper input:focus + i,
    .input-wrapper input:focus ~ i { color: var(--primary); }
    .auth-error {
      background: rgba(208,2,27,0.1);
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      margin-bottom: 1rem;
      align-items: center;
      gap: 0.5rem;
    }
    .auth-error.visible { display: flex; }
    .auth-success {
      background: rgba(126,211,33,0.1);
      color: var(--success-dark);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      margin-bottom: 1rem;
      align-items: center;
      gap: 0.5rem;
    }
    .auth-success.visible { display: flex; }
    .btn-auth {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 50px;
    }
    .btn-auth:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,144,226,0.4); }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-auth .spinner { display: none; }
    .btn-auth.loading .spinner { display: inline-block; }
    .btn-auth.loading .btn-text { display: none; }
    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    .auth-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-links a:hover { text-decoration: underline; }
    .forgot-link {
      text-align: right;
      margin-top: -0.5rem;
      margin-bottom: 1.25rem;
    }
    .forgot-link a {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .forgot-link a:hover { color: var(--primary); }
    .divider {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
      color: var(--text-light);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border-color);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* Modal de recuperación */
    .recovery-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .recovery-modal.visible { display: flex; }
    .recovery-content {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .recovery-content h3 {
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .recovery-content p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <div class="logo-large"><i class="fas fa-paw"></i></div>
        <h1>PetCare Pro</h1>
        <p>Cuidado integral para tu mascota</p>
      </div>
      <div class="auth-body">
        <div id="auth-error" class="auth-error">
          <i class="fas fa-exclamation-circle"></i>
          <span id="error-text"></span>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label>Correo electrónico</label>
            <div class="input-wrapper">
              <input type="email" id="login-email" placeholder="tu@correo.com" required autocomplete="email">
              <i class="fas fa-envelope"></i>
            </div>
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
              <input type="password" id="login-password" placeholder="Tu contraseña" required autocomplete="current-password">
              <i class="fas fa-lock"></i>
            </div>
          </div>
          <div class="forgot-link">
            <a href="#" id="forgot-password-link">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn-auth" id="login-btn">
            <span class="btn-text">Iniciar Sesión</span>
            <i class="fas fa-spinner fa-spin spinner"></i>
          </button>
        </form>

        <div class="auth-links">
          <p>¿No tienes cuenta? <a href="signup.html">Regístrate aquí</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Recuperar Contraseña -->
  <div id="recovery-modal" class="recovery-modal">
    <div class="recovery-content">
      <h3><i class="fas fa-key" style="color:var(--primary)"></i> Recuperar Contraseña</h3>
      <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
      <div id="recovery-error" class="auth-error">
        <i class="fas fa-exclamation-circle"></i>
        <span id="recovery-error-text"></span>
      </div>
      <div id="recovery-success" class="auth-success">
        <i class="fas fa-check-circle"></i>
        <span>Correo enviado. Revisa tu bandeja de entrada.</span>
      </div>
      <form id="recovery-form" novalidate>
        <div class="form-group">
          <div class="input-wrapper">
            <input type="email" id="recovery-email" placeholder="tu@correo.com" required>
            <i class="fas fa-envelope"></i>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="recovery-btn">
          <span class="btn-text">Enviar enlace</span>
          <i class="fas fa-spinner fa-spin spinner"></i>
        </button>
      </form>
      <div style="text-align:center;margin-top:1rem">
        <a href="#" id="close-recovery" style="color:var(--text-secondary);font-size:0.9rem">Cancelar</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // Redirigir según rol
    async function redirigirPorRol(user) {
      const { role } = await obtenerRolUsuario(user.uid);
      const VET_ROLES = ['vet', 'clinic_admin', 'clinic_vet', 'clinic_receptionist'];
      if (VET_ROLES.includes(role)) {
        window.location.href = 'vet/dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
    }

    // Verificar si ya está autenticado
    auth.onAuthStateChanged(user => {
      if (user) redirigirPorRol(user);
    });

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('auth-error');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        errorDiv.querySelector('span').textContent = 'Completa todos los campos.';
        errorDiv.classList.add('visible');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      errorDiv.classList.remove('visible');

      const result = await iniciarSesion(email, password);
      if (result.success) {
        await redirigirPorRol(result.user);
      } else {
        document.getElementById('error-text').textContent = result.error;
        errorDiv.classList.add('visible');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // Recuperar contraseña modal
    document.getElementById('forgot-password-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('recovery-modal').classList.add('visible');
      document.getElementById('recovery-email').value = document.getElementById('login-email').value;
    });

    document.getElementById('close-recovery').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('recovery-modal').classList.remove('visible');
    });

    document.getElementById('recovery-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('recovery-btn');
      const email = document.getElementById('recovery-email').value.trim();
      const errorDiv = document.getElementById('recovery-error');
      const successDiv = document.getElementById('recovery-success');

      if (!email) {
        errorDiv.querySelector('span').textContent = 'Ingresa tu correo electrónico.';
        errorDiv.classList.add('visible');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      errorDiv.classList.remove('visible');
      successDiv.classList.remove('visible');

      const result = await recuperarContrasena(email);
      if (result.success) {
        successDiv.classList.add('visible');
      } else {
        document.getElementById('recovery-error-text').textContent = result.error;
        errorDiv.classList.add('visible');
      }
      btn.classList.remove('loading');
      btn.disabled = false;
    });
  </script>
</body>
</html>
